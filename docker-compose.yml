services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: wf_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_builder
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wf_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: